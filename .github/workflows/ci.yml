name: portable-cpp17

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC / Clang
        if: matrix.compiler != 'msvc'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCHJSON_BUILD_CONFIG_TESTS=ON -DCHJSON_BUILD_BENCHMARKS=ON
      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build -A x64 -DCHJSON_BUILD_CONFIG_TESTS=ON -DCHJSON_BUILD_BENCHMARKS=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DCHJSON_ENABLE_SANITIZERS=ON -DCHJSON_BUILD_CONFIG_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  linux-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-m32 -DCHJSON_BUILD_CONFIG_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
